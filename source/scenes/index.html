:root{
  --bg:#081426; --bg2:#050d1a; --card:#0e1d35; --card2:#12264a; --line:#1d3560;
  --blue:#2f86ff; --blue2:#5aa2ff; --cyan:#29abe2; --yellow:#f9ee23; --red:#ff3b44; --green:#22c55e;
  --text:#eef4ff; --muted:#8ea3c4; --dim:#5b7091;
  --ui:#ffffff; --ui2:#f3f6fb; --uiline:#e3e9f3; --uitext:#0d1b33; --uimuted:#6b7a93;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:Heebo,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
#bg{position:absolute;inset:0}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
#grid{position:absolute;inset:0;background-image:radial-gradient(rgba(120,160,230,.10) 1.2px,transparent 1.3px);background-size:36px 36px;mask-image:radial-gradient(ellipse at 50% 45%,#000 30%,transparent 78%)}
.scene{position:absolute;inset:0;display:none}
.abs{position:absolute}
.w{display:inline-block;white-space:pre}
.blue{color:var(--blue)}
.muted{color:var(--muted)}

/* chrome */
#chrome-logo{position:absolute;left:64px;top:52px;height:34px;opacity:.95}
#chrome-tag{position:absolute;right:72px;top:58px;display:flex;align-items:center;gap:12px;font-size:19px;font-weight:500;color:var(--blue2);letter-spacing:.2px}
.tri{display:flex;gap:4px}
.tri i{display:block;width:12px;height:3px;border-radius:2px}

h1.big{font-weight:800;font-size:96px;line-height:1.08;letter-spacing:-1px}
h2.title{font-weight:800;font-size:66px;line-height:1.1;letter-spacing:-.5px}
.underline{height:5px;width:96px;border-radius:3px;background:var(--blue)}
.sub{font-size:30px;color:var(--muted);font-weight:400;line-height:1.4}
.before{display:inline-flex;align-items:center;gap:10px;font-size:22px;color:#ffb4b8;background:rgba(255,59,68,.10);border:1px solid rgba(255,59,68,.30);padding:8px 16px;border-radius:999px;font-weight:500}
.before b{color:var(--red);font-weight:700}

/* cards */
.card{background:linear-gradient(180deg,#10223f,#0c1a31);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;background:#0f2242;border:1px solid #24406e;font-size:22px;font-weight:600;color:#dfe9fb;white-space:nowrap}
.chip svg{width:22px;height:22px;stroke:var(--blue2)}
.pill{display:inline-flex;align-items:center;gap:12px;padding:14px 28px;border-radius:999px;font-size:34px;font-weight:700;border:2px solid #2d5aa0;background:#0f2242}
.pill.solid{background:var(--blue);border-color:var(--blue);color:#fff}
.ico{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* light UI */
.ui{background:var(--ui);color:var(--uitext);border-radius:20px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.5)}
.ui .bar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--uiline);background:#fafcff;font-size:18px;font-weight:600;color:var(--uimuted)}
.dots{display:flex;gap:7px;direction:ltr}.dots i{width:11px;height:11px;border-radius:50%;background:#dfe5ee;display:block}
.cursor{position:absolute;width:40px;height:40px;z-index:50;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.ripple{position:absolute;width:70px;height:70px;border-radius:50%;border:3px solid var(--blue);z-index:49;opacity:0}
.hlr{border:3px solid #2f86ff;border-radius:14px;box-shadow:0 0 0 6px rgba(47,134,255,.18),0 0 40px rgba(47,134,255,.35);opacity:0;z-index:40;pointer-events:none}
.toast{position:absolute;display:flex;align-items:center;gap:12px;background:#0d1b33;color:#fff;padding:14px 24px;border-radius:14px;font-size:21px;font-weight:600;box-shadow:0 20px 50px rgba(0,0,0,.35);white-space:nowrap}
.toast .ok{width:26px;height:26px;border-radius:50%;background:var(--green);display:grid;place-items:center}

/* captions list */
.caps{display:flex;flex-direction:column;gap:22px}
.cap{display:flex;align-items:flex-start;gap:16px;font-size:30px;font-weight:600;line-height:1.35;color:var(--text)}
.cap .n{flex:none;width:44px;height:44px;border-radius:12px;background:#12264a;border:1px solid #2a4c85;display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--blue2);margin-top:1px}

    <div class="glow" id="g1" style="width:900px;height:900px;background:#1553b8"></div>

<script>
// ---------- helpers ----------
const CU=(k,n,d)=>(window.CUES&&CUES[k]&&CUES[k][n]!=null)?CUES[k][n]:d;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const P=(lt,a,d=.6)=>clamp((lt-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
function show(el,p,o={}){
  if(!el)return;
  const {dy=26,dx=0,s=0,blur=6,back=false}=o;
  const e=back?eback(p):eo(p);
  el.style.opacity=clamp(eo(p)*1.0);
  el.style.transform=`translate(${(1-e)*dx}px,${(1-e)*dy}px) scale(${1-(1-e)*s})`;
  el.style.filter=(blur&&p<1)?`blur(${(1-eo(p))*blur}px)`:'none';
}
function W(text){ // words -> spans; *x* = blue
  return text.split(' ').map(w=>{
    let cls='w'; if(w.startsWith('*')&&w.endsWith('*')){cls+=' blue';w=w.slice(1,-1);}
    return `<span class="${cls}">${w}</span>`;}).join(' ');
}
function words(el,lt,start,per=.07,d=.5,o={}){
  if(!el)return; const ws=el.querySelectorAll('.w');
  ws.forEach((w,i)=>show(w,P(lt,start+i*per,d),{dy:18,blur:8,...o}));
}
const $=(r,s)=>r.querySelector(s); const $$=(r,s)=>[...r.querySelectorAll(s)];
function typeText(el,full,lt,start,cps=22){
  const n=Math.floor(clamp((lt-start)*cps,0,full.length)); el.textContent=full.slice(0,n);
  return n>=full.length;
}
const ICONS={
 cart:'<path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/>',
 building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h.01M15 7h.01M9 11h.01M15 11h.01M9 15h.01M15 15h.01M10 21v-3h4v3"/>',
 tablet:'<rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M11 18h2"/>',
 chat:'<path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5z"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>',
 headset:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19c0 1.5-2 2.5-5 2.5"/>',
 store:'<path d="M4 9h16l-1.2-4.2A1.5 1.5 0 0 0 17.4 4H6.6a1.5 1.5 0 0 0-1.4.8z"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"/><path d="M9 20v-5h6v5"/>',
 pos:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10M12 16v4M7 8h6"/>',
 box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
 ocr:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 10h8M8 14h5"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2c2.1.7 3.5 2.8 3.5 5.8"/>',
 spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 truck:'<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
 heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
 check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
 db:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
 layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 shield:'<path d="M12 3 5 6v6c0 4.5 3 7.7 7 9 4-1.3 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/>',

 alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',

 file:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/>',
 pot:'<path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M2 10h2M20 10h2M9 6.5h6M12 6.5V10"/>',
};
const I=(n,cls='ico',sw)=>`<svg viewBox="0 0 24 24" class="${cls}" ${sw?`style="stroke-width:${sw}"`:''}>${ICONS[n]}</svg>`;
const CURSOR=`<svg viewBox="0 0 40 40" class="cursor"><path d="M8 4 L8 32 L15.5 25 L20.5 36 L25 34 L20 23 L30 23 Z" fill="#fff" stroke="#0d1b33" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
// cursor path helper: keys [[t,x,y],...], clicks [t,...]
function moveCursor(cur,rip,lt,keys,clicks=[]){
  let x=keys[0][1],y=keys[0][2],op=clamp((lt-keys[0][0]+.3)/.3);
  for(let i=0;i<keys.length-1;i++){const [t0,x0,y0]=keys[i],[t1,x1,y1]=keys[i+1];
    if(lt>=t0&&lt<=t1){const p=eio((lt-t0)/(t1-t0));x=lerp(x0,x1,p);y=lerp(y0,y1,p);} else if(lt>t1){x=x1;y=y1;}}
  let sc=1; rip.style.opacity=0;
  clicks.forEach(c=>{const d=lt-c; if(d>=0&&d<.18) sc=1-.15*Math.sin(d/.18*Math.PI);
    if(d>=0&&d<.55){rip.style.opacity=(1-d/.55)*.9; const r=.4+d/.55*.9; rip.style.transform=`scale(${r})`; rip.style.left=(x-35)+'px'; rip.style.top=(y-35)+'px';}});
  cur.style.opacity=op; cur.style.left=(x-8)+'px'; cur.style.top=(y-4)+'px'; cur.style.transform=`scale(${sc})`;
}
const TAGS={};

// ---------- scenes ----------
const S={};

S.hook={nat:6,tag:'',html:`
 <div class="abs" style="inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px">
   <div class="l1" style="font-size:112px;font-weight:800;letter-spacing:-1px">${W('ה־ERP שלכם מצוין.')}</div>
   <div class="l2" style="font-size:54px;font-weight:500;color:var(--muted)">${W('אבל המכירות, השיווק והשירות שלכם')}</div>
   <div class="l3" style="font-size:112px;font-weight:800;color:var(--blue);letter-spacing:-1px">${W('לא סובלים אותו.')}</div>
 </div>`,
 update(r,lt){ const a=CU('hook','l1',.25),b=CU('hook','l2',2.0),c=CU('hook','l3',3.3); words($(r,'.l1'),lt,a,.12,.6); words($(r,'.l2'),lt,b,.09,.55); words($(r,'.l3'),lt,c,.14,.6,{dy:30});
   const l1=$(r,'.l1'); l1.style.opacity=lt>c? String(lerp(1,.55,eo(P(lt,c,.8)))):'1';}
};

const CH=[['cart','אתר B2C'],['building','אתר B2B'],['tablet','טאבלט סוכן'],['chat','וואטסאפ'],['mail','מייל'],['headset','מרכזייה'],['store','מרקטפלייס'],['pos','קופות']];
S.channels={nat:8,tag:'האתגר',html:`
 <div class="abs" style="right:150px;top:250px;width:760px">
   <h2 class="title q qL">${W('בכמה ערוצים מנוהל המוצר אצל אותו יצרן?')}</h2><h2 class="title q qS">${W('בכמה ערוצים מנוהל אותו מוצר אצל יבואן?')}</h2>
   <div class="underline u" style="margin-top:34px"></div>
   <div class="num" style="font-size:230px;font-weight:900;color:var(--blue);line-height:1;margin-top:30px;direction:ltr;text-align:right">7-8</div>
   <div class="s" style="margin-top:24px;font-size:36px;font-weight:500;display:flex;align-items:center;gap:18px"><span style="width:5px;height:42px;background:var(--yellow);border-radius:3px"></span><span>${W('ואף אחד מהם לא מדבר עם השני.')}</span></div>
 </div>
 <div class="abs orbit" style="left:130px;top:150px;width:780px;height:780px">
   <svg class="abs lines" width="780" height="780" style="left:0;top:0;overflow:visible"></svg>
   <div class="abs core" style="left:260px;top:260px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4b9bff,#1f6ae6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 0 30px rgba(47,134,255,.08),0 0 120px rgba(47,134,255,.55)">
     ${I('box','ico',1.6).replace('class="ico"','class="ico" style="width:72px;height:72px;stroke:#fff"')}
     <div style="font-size:32px;font-weight:700">מוצר אחד</div>
   </div>
   ${CH.map((c,i)=>`<div class="abs chip ch" data-i="${i}">${I(c[0])}<span>${c[1]}</span></div>`).join('')}
 </div>`,
 init(r){ const cx=390,cy=390,R=330; const svg=$(r,'.lines'); let h='';
   $$(r,'.ch').forEach((c,i)=>{const a=-Math.PI/2+i*2*Math.PI/8; const x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
     c.dataset.x=x;c.dataset.y=y; h+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#3a6fc4" stroke-width="2" stroke-dasharray="6 9" class="ln"/>`;});
   h+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#1d3560" stroke-width="1.5" stroke-dasharray="3 8"/>`;
   svg.innerHTML=h; },
 update(r,lt){ const RED=CU('channels','red',4.3); const L=window.VARIANT==='long'; $(r,'.qL').style.display=L?'':'none'; $(r,'.qS').style.display=L?'none':''; words($(r,L?'.qL':'.qS'),lt,.2,.09,.55); show($(r,'.u'),P(lt,.9,.5),{dy:0});
   show($(r,'.core'),P(lt,.2,.8),{s:.4,dy:0,back:true});
   const lns=$$(r,'.ln');
   $$(r,'.ch').forEach((c,i)=>{const p=P(lt,.8+i*.22,.55); const w=c.offsetWidth,h=c.offsetHeight;
     const jig=lt>RED+.3? Math.sin(lt*3+i*1.7)*3:0;
     c.style.left=(+c.dataset.x-w/2+jig)+'px'; c.style.top=(+c.dataset.y-h/2+Math.cos(lt*2.6+i)*jig)+'px'; show(c,p,{s:.5,dy:0,back:true});
     const ln=lns[i]; ln.style.opacity=eo(p)*(lt>RED+.3? (.35+.3*Math.sin(lt*9+i*2)) : .9);
     { const L=CU('channels','list',1e9); const ord=[1,0,3,4]; const k=ord.indexOf(i); if(k>=0){ const g=Math.max(0,1-Math.abs(lt-(L+.3+k*.62))/.45); c.style.boxShadow=g>0?`0 0 0 ${3*g}px #5aa2ff, 0 0 ${30*g}px rgba(90,162,255,.6)`:''; c.style.transform+=` scale(${1+.12*g})`; } }
     ln.setAttribute('stroke', lt>RED+.3? '#ff3b44':'#3a6fc4');});

     for(let k=0;k<6;k++){const f=((lt*0.55+k/6)%1); const x=lerp(erpX,rmsL,f); h+=`<circle cx="${x}" cy="${lerp(erpY,rmsY,f)}" r="6" fill="#5aa2ff" opacity="${pa*Math.sin(f*Math.PI)}"/>`;
       if(lt>T3){const x2=lerp(rmsL,erpX,f); h+=`<circle cx="${x2}" cy="${erpY+14}" r="4.5" fill="#f9ee23" opacity="${.8*Math.sin(f*Math.PI)*eo(P(lt,T3,.5))}"/>`;}}}
   crs.forEach((c,i)=>{const lit=eo(P(lt,T3+.2+i*.22,.4)); if(lit<=0)return; const y=300+i*66+26; const x1=1920-150-400;
     h+=`<path d="M${rmsR} ${rmsY} C ${rmsR+120} ${rmsY}, ${x1-120} ${y}, ${x1} ${y}" stroke="rgba(90,162,255,${.45*lit})" stroke-width="2" fill="none"/>`;
     const f=((lt*.5+i*.13)%1); const bx=(t)=>{const u=1-t;return u*u*u*rmsR+3*u*u*t*(rmsR+120)+3*u*t*t*(x1-120)+t*t*t*x1;}; const by=(t)=>{const u=1-t;return u*u*u*rmsY+3*u*u*t*rmsY+3*u*t*t*y+t*t*t*y;};
     h+=`<circle cx="${bx(f)}" cy="${by(f)}" r="5" fill="#5aa2ff" opacity="${lit*Math.sin(f*Math.PI)}"/>`;

 }

portal('catalog',{nat:6,tag:'הדמו · קטלוג',page:'catalog',url:'קטלוג מוצרים',

// ---------- timelines ----------
const TL={
 long:window.TL_LONG||[['hook',6],['channels',8],['pain',9],['who',7],['reveal',7],['how',10],['dash',8],['risk',6],['ai',11],['c360',6],['catalog',6],['orders',10],['insights',6],['marketing',5],['diff',7],['logos',5],['outro',7]],
 short:[['hook',5.1],['channels',6],['pain',6.5],['reveal',4.5],['how',7.7],['dash',7],['risk',4.5],['ai',8.5],['logos',3.5],['outro',5.5]],
};
let CUR=null; const roots={};
async function setup(){
  const logoSvg=await (await fetch('assets/logo-white.svg')).text();
  const box=document.getElementById('scenes');
  for(const [k,s] of Object.entries(S)){ const d=document.createElement('section'); d.className='scene'; d.id='s-'+k;
    d.innerHTML=s.html.replace('LOGO',logoSvg.replace('<svg ','<svg style="width:100%;height:100%;overflow:visible" ')); box.appendChild(d); roots[k]=d;
  }
  const ifr=[...document.querySelectorAll('iframe')];
  await Promise.all(ifr.map(f=>new Promise(res=>{ if(f.contentDocument&&f.contentDocument.readyState==='complete'&&f.contentDocument.body&&f.contentDocument.body.children.length) res(); else { f.addEventListener('load',res,{once:true}); setTimeout(res,8000);} })));
  const TO=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);
  for(const f of ifr){ try{ await TO(f.contentDocument.fonts.ready,3000); await TO(Promise.all([...f.contentDocument.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))),3000); }catch(e){} }
  for(const [k,s] of Object.entries(S)){ const d=roots[k]; d.style.display='block'; s.init&&s.init(d);
    const f=d.querySelector('iframe'); if(f){ f.contentDocument.body.getBoundingClientRect(); for(let i=0;i<3;i++){ await TO(f.contentDocument.fonts.ready,3000); await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))); } }
    d.style.display='none'; }
  await document.fonts.ready; await Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
}
function total(name){return TL[name].reduce((a,b)=>a+b[1],0);}
function renderAt(t,name){
  window.CUES = (name==='long') ? (window.CUES_LONG||{}) : {}; window.VARIANT=name;
  const tl=TL[name]; let acc=0, idx=tl.length-1;
  for(let i=0;i<tl.length;i++){ if(t<acc+tl[i][1]){idx=i;break;} acc+=tl[i][1]; }
  if(idx===tl.length-1 && t>=acc+tl[idx][1]) {}
  const [key,dur]=tl[idx]; const s=S[key]; const lt0=t-acc;
  for(const k in roots) if(k!==key) roots[k].style.display='none';
  const r=roots[key]; r.style.display='block';
  const k=Math.max(1,s.nat/dur); const lt=lt0*k;
  const prevK=idx>0?tl[idx-1][0]:null, nextK=idx<tl.length-1?tl[idx+1][0]:null;
  window.__fromPortal = !!(s.portal && prevK && S[prevK].portal);
  const toPortal = !!(s.portal && nextK && S[nextK].portal);
  s.update(r,lt,dur);
  // scene exit (dip through bg)
  const out=clamp((lt0-(dur-.4))/.4); const isLast=idx===tl.length-1;
  const o=isLast? 1-clamp((lt0-(dur-.6))/.6) : 1-eio(out);
  if(toPortal){ r.style.opacity=1; r.style.filter='none'; r.style.transform='none'; const pt=$(r,'.ptl'); if(pt) pt.style.opacity=1-eio(out); }
  else { const push = s.portal?0:.03*clamp(lt0/dur); r.style.opacity=o; r.style.transform=`scale(${(1+push)*(1-.02*eio(out))})`; r.style.filter= out>0&&!isLast?`blur(${out*6}px)`:'none'; const pt=$(r,'.ptl'); if(pt) pt.style.opacity=1; }
  // chrome
  const tag=s.tag; const tg=document.getElementById('chrome-tag'); document.getElementById('tagtext').textContent=tag;
  const tp=tag? eo(clamp(lt0/.5)) : 0; tg.style.opacity=tp*o;
  const lg=document.getElementById('chrome-logo'); const showLogo=!(key==='reveal'||key==='outro'||key==='hook');
  lg.style.opacity= showLogo? .95*o*eo(clamp(lt0/.5)) : 0;
  // bg drift
  const g1=document.getElementById('g1'),g2=document.getElementById('g2'),g3=document.getElementById('g3');
  g1.style.left=(1100+Math.sin(t*.13)*180)+'px'; g1.style.top=(-420+Math.cos(t*.11)*120)+'px';
  g2.style.left=(-300+Math.cos(t*.09)*160)+'px'; g2.style.top=(560+Math.sin(t*.12)*100)+'px';
  g3.style.left=(700+Math.sin(t*.07+1)*300)+'px'; g3.style.top=(300+Math.cos(t*.1)*160)+'px';
  const fin = isLast? o : 1; document.getElementById('bg').style.opacity=.35+.65*fin;
}
const EV={risk:{c:[5.25]},ai:{c:[1.85]},catalog:{c:[3.0,3.3,4.25],s:[4.3]},orders:{c:[5.0],s:[5.05,8.0]}};
const INT={hook:.2,channels:.4,pain:.55,who:.55,reveal:.8,outro:.6};
function events(name){ window.CUES=(name==='long')?(window.CUES_LONG||{}):{}; const tl=TL[name]; let acc=0; const out={duration:total(name),boundaries:[],clicks:[],success:[],sections:[]};
  tl.forEach(([k,dur],i)=>{ const s=S[k]; const kk=Math.max(1,s.nat/dur); if(i>0) out.boundaries.push(acc);
    const e=EV[k]||{}; const sh=(k==='ai')?(CU('ai','click',1.85)-1.85):0; (e.c||[]).forEach(t=>out.clicks.push(acc+(t+sh)/kk)); (e.s||[]).forEach(t=>out.success.push(acc+t/kk));
    out.sections.push([acc,acc+dur, INT[k]!==undefined?INT[k]:(i>=tl.length-3?.7:1)]); acc+=dur; });
  return out; }
window.events=events; window.setup=setup; window.renderAt=renderAt; window.total=total; window.TL=TL;
